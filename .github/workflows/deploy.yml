name: Deploy to Railway
run-name: MergeGuard deploy ${{ inputs.request_id || github.run_id }} PR #${{ inputs.pr_number || 'push' }} ${{ inputs.head_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact reviewed commit to deploy
        required: true
        type: string
      pr_number:
        description: Reviewed pull request number
        required: true
        type: string
      request_id:
        description: Unique MergeGuard dispatch identifier
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Trigger Railway redeploy
        run: |
          curl -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "main"}'

      - name: Health check
        run: |
          sleep 15
          curl -f "${{ secrets.RAILWAY_APP_URL }}/health"
