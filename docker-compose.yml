x-agent-base: &agent-base
  build: .
  env_file: .env
  restart: unless-stopped

services:
  webhook:
    <<: *agent-base
    command: python -m webhook.main
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  agents:
    <<: *agent-base
    command: python -m run_all_agents
